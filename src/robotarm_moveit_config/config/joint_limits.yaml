# Joint limits used by MoveIt for trajectory time parameterization (OMPL pipeline), by the
# Pilz planner and by the jerk-limited Ruckig smoothing (AddRuckigTrajectorySmoothing adapter and
# robotarm_trajectory_smoothing). Loaded by MoveItConfigsBuilder as parameter
# "robot_description_planning".
#
# Rules:
#   - Position limits are NOT overridden here; they come from the URDF.
#   - A velocity limit here may not exceed the URDF velocity limit (2.5-3.14 rad/s at the moment),
#     otherwise the Pilz planner refuses to start. Raise the URDF limit first.
#   - Pilz requires an acceleration limit for every joint of a planning group.
#   - Pilz checks the joint accelerations of a LIN (from the IK of the Cartesian line) against
#     max_acceleration; a limit close to what a LIN needs makes it fail at random ("Joint
#     deceleration limit ... violated").
#   - Ruckig (OMPL) and robotarm_trajectory_smoothing (Pilz) need a jerk limit for every joint.
#     The request's scaling factors scale velocity and acceleration, but NOT jerk. A lower jerk
#     gives smoother, but longer motions with rounder blend corners.
#   - Actual motions are additionally scaled by the velocity/acceleration scaling factor of each
#     request (RViz sliders "Velocity/Accel. Scaling", or MotionPlanRequest fields). The defaults
#     below apply when a request does not set them (0 means "use default").

default_velocity_scaling_factor: 0.1
default_acceleration_scaling_factor: 0.1

joint_limits:
  axis1:
    has_velocity_limits: true
    max_velocity: 2.0
    has_acceleration_limits: true
    max_acceleration: 4.0
    has_jerk_limits: true
    max_jerk: 15.0
  axis2:
    has_velocity_limits: true
    max_velocity: 2.0
    has_acceleration_limits: true
    max_acceleration: 4.0
    has_jerk_limits: true
    max_jerk: 15.0
  axis3:
    has_velocity_limits: true
    max_velocity: 2.0
    has_acceleration_limits: true
    max_acceleration: 4.0
    has_jerk_limits: true
    max_jerk: 15.0
  axis4:
    has_velocity_limits: true
    max_velocity: 2.0
    has_acceleration_limits: true
    max_acceleration: 4.0
    has_jerk_limits: true
    max_jerk: 15.0
  axis5:
    has_velocity_limits: true
    max_velocity: 2.0
    has_acceleration_limits: true
    max_acceleration: 4.0
    has_jerk_limits: true
    max_jerk: 15.0
  axis6:
    has_velocity_limits: true
    max_velocity: 2.0
    has_acceleration_limits: true
    max_acceleration: 4.0
    has_jerk_limits: true
    max_jerk: 15.0
