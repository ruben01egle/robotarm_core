# Joint limits used by MoveIt for trajectory time parameterization (OMPL pipeline) and by the
# Pilz planner. Loaded by MoveItConfigsBuilder as parameter "robot_description_planning".
#
# !!! PRELIMINARY VALUES - VERIFY ON HARDWARE BEFORE RAISING !!!
# The URDF (robotarm_description) only has placeholder limits (velocity="1", effort="1") and no
# acceleration limits. The values below are deliberately conservative guesses:
#   - main axes 1..3 (carry the arm, high inertia): 0.8 rad/s, 1.5 rad/s^2
#   - wrist axes 4..6 (low inertia):                1.0 rad/s, 2.0 rad/s^2
# For comparison, the TeleopController on the RT PC uses 3 rad/s and 4 rad/s^2.
#
# Rules:
#   - Position limits are NOT overridden here; they come from the URDF.
#   - A velocity limit here may not exceed the URDF velocity limit (1.0 rad/s at the moment),
#     otherwise the Pilz planner refuses to start. Raise the URDF limit first.
#   - Pilz requires an acceleration limit for every joint of a planning group.
#   - Actual motions are additionally scaled by the velocity/acceleration scaling factor of each
#     request (RViz sliders "Velocity/Accel. Scaling", or MotionPlanRequest fields). The defaults
#     below apply when a request does not set them (0 means "use default").

default_velocity_scaling_factor: 0.1
default_acceleration_scaling_factor: 0.1

joint_limits:
  axis1:
    has_velocity_limits: true
    max_velocity: 0.8
    has_acceleration_limits: true
    max_acceleration: 1.5
  axis2:
    has_velocity_limits: true
    max_velocity: 0.8
    has_acceleration_limits: true
    max_acceleration: 1.5
  axis3:
    has_velocity_limits: true
    max_velocity: 0.8
    has_acceleration_limits: true
    max_acceleration: 1.5
  axis4:
    has_velocity_limits: true
    max_velocity: 1.0
    has_acceleration_limits: true
    max_acceleration: 2.0
  axis5:
    has_velocity_limits: true
    max_velocity: 1.0
    has_acceleration_limits: true
    max_acceleration: 2.0
  axis6:
    has_velocity_limits: true
    max_velocity: 1.0
    has_acceleration_limits: true
    max_acceleration: 2.0
