version: '3.8'

services:
  # Deine GUI-App
  gui_app:
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
    volumes:
      - .:/ros2_ws/src
      - /tmp/.X11-unix:/tmp/.X11-unix
    command: /bin/bash -c "source /opt/ros/humble/setup.bash && tail -f /dev/null"

  # Der Micro-ROS Agent
  micro-ros-agent:
    image: microros/micro-ros-agent:humble
    network_mode: host
    # WICHTIG: Port 8888 für UDP (wie in deinem Test-Befehl)
    command: udp4 --port 8888
    restart: always